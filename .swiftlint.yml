included:
  - CafeHunter

excluded:
  - .build
  - DerivedData
  - functions
  - "**/.swiftpm"

# Tuned to existing house style: aligned-equals in struct/enum bodies,
# multi-line dictionary literals indented past the colon, and SwiftUI's
# heavily-chained modifier blocks.
disabled_rules:
  - trailing_whitespace          # editorconfig handles this
  - todo                         # TODOs are acceptable in this codebase
  - opening_brace                # SwiftUI ViewBuilder closures look fine as-is
  - multiple_closures_with_trailing_closure  # SwiftUI .onAppear / .onChange chains

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_string
  - fatal_error_message
  - force_unwrapping
  - implicit_return
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - toggle_bool
  - unused_import
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded:
    - id
    - db
    - vc
    - to
    - in
    - or
    - r
    - g
    - b
    - a

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

function_body_length:
  warning: 80
  error: 200

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 2

force_cast: warning
force_try: warning
force_unwrapping: warning

reporter: "xcode"
